services:
  - type: web
    name: windsight
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: DEBUG
        value: "false"
      - key: AUTO_SEED_ON_STARTUP
        value: "true"
      - key: ELEXON_API_BASE_URL
        value: "https://data.elexon.co.uk/bmrs/api/v1"
